<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a18;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── HEADER ── */
    #header {
      display: flex;
      align-items: center;
      padding: 6px 16px;
      background: #12122a;
      border-bottom: 1px solid #2a2a5a;
      gap: 10px;
      flex-shrink: 0;
      min-height: 44px;
    }
    #title {
      font-size: 13px;
      font-weight: bold;
      color: #8888ff;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    #agent-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .agent-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #1e1e3a;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      border: 1px solid #2a2a5a;
    }
    .agent-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    #event-badge {
      margin-left: auto;
      background: #2a2a5a;
      border: 1px solid #5555aa;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 11px;
      color: #aaaaff;
      display: none;
    }
    #event-badge.show { display: block; }

    /* ── MAIN LAYOUT ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── CANVAS AREA ── */
    #canvas-wrap {
      flex: 1;
      position: relative;
      background: #0a0a18;
    }
    #canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
    #label-renderer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* ── RIGHT PANEL ── */
    #right-panel {
      width: 300px;
      display: flex;
      flex-direction: column;
      background: #111128;
      border-left: 1px solid #1e1e3a;
      flex-shrink: 0;
    }
    #controls {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-bottom: 1px solid #1e1e3a;
      flex-wrap: wrap;
    }

    /* ── TABS ── */
    #tabs {
      display: flex;
      border-bottom: 1px solid #1e1e3a;
    }
    .tab {
      background: none;
      border: none;
      color: #888;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
    }
    .tab:hover { color: #aaaaff; }
    .tab.active { color: #aaaaff; border-bottom: 2px solid #5555cc; }

    /* ── TAB PANELS ── */
    .tab-panel {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: #2a2a5a #111128;
    }
    .tab-panel::-webkit-scrollbar { width: 4px; }
    .tab-panel::-webkit-scrollbar-track { background: #111128; }
    .tab-panel::-webkit-scrollbar-thumb { background: #2a2a5a; border-radius: 4px; }

    /* ── CHAT LOG ── */
    #chat-log {
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .chat-msg {
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      line-height: 1.4;
      max-width: 100%;
    }
    .chat-msg.user   { background: #20204a; border: 1px solid #3a3a7a; }
    .chat-msg.agent  { background: #1a1a30; border: 1px solid #2a2a4a; }
    .chat-msg.system { background: #181830; border: 1px solid #2a2a4a; }
    .msg-sender { font-size: 10.5px; font-weight: bold; margin-bottom: 3px; opacity: 0.8; }
    .msg-text { opacity: 0.9; }
    .thinking-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: #6666cc; display: inline-block;
      animation: thinkanim 0.9s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.30s; }
    @keyframes thinkanim {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1.0); opacity: 1.0; }
    }

    /* ── TASK LIST ── */
    #task-list {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .task-item {
      border-left: 3px solid #333;
      padding: 10px;
      margin: 2px 0;
      background: #161628;
      border-radius: 6px;
      font-size: 11px;
    }
    .task-item.in_progress { border-left-color: #5577ff; }
    .task-item.done { border-left-color: #44aa66; opacity: 0.7; }
    .task-header {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin-bottom: 4px;
    }
    .task-icon { flex-shrink: 0; }
    .task-title { font-size: 12px; font-weight: bold; flex: 1; line-height: 1.3; }
    .task-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      margin-bottom: 4px;
    }
    .task-age { opacity: 0.4; }
    .task-update { font-size: 11px; opacity: 0.7; font-style: italic; line-height: 1.3; }
    .task-history { padding: 4px 0 0 0; display: flex; flex-direction: column; gap: 2px; }
    .update-item { font-size: 10px; opacity: 0.6; padding: 2px 0; }

    /* ── INPUT AREA ── */
    #input-area {
      display: flex;
      padding: 8px;
      gap: 6px;
      border-top: 1px solid #1e1e3a;
      flex-shrink: 0;
    }
    #chat-input {
      flex: 1;
      background: #1a1a30;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 7px 9px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    #chat-input:focus { border-color: #6666cc; }
    #chat-input::placeholder { opacity: 0.35; }

    /* ── MIC BUTTON ── */
    #mic-wrap {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    #mic-label {
      font-size: 11px;
      color: rgba(170,170,255,0.7);
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #mic-wrap:hover #mic-label,
    #mic-wrap.active #mic-label { opacity: 1; }
    #mic-btn {
      pointer-events: all;
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e1e3f, #16163a);
      border: 1.5px solid #3a3a7a;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    #mic-btn:hover {
      border-color: #6666cc;
      box-shadow: 0 4px 24px rgba(100,100,200,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
      transform: scale(1.05);
    }
    #mic-btn svg { transition: all 0.2s; }
    #mic-btn.recording {
      background: linear-gradient(145deg, #3a1010, #2a0a0a);
      border-color: #cc4444;
      box-shadow: 0 4px 24px rgba(200,60,60,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      transform: scale(1.1);
    }
    #mic-btn.transcribing {
      background: linear-gradient(145deg, #101a3a, #0a1228);
      border-color: #4466cc;
      box-shadow: 0 4px 24px rgba(60,100,200,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    /* ripple rings when recording */
    #mic-btn.recording::before,
    #mic-btn.recording::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(204,68,68,0.5);
      animation: micRipple 1.4s ease-out infinite;
    }
    #mic-btn.recording::after { animation-delay: 0.7s; }
    @keyframes micRipple {
      0%   { width: 54px; height: 54px; opacity: 0.8; }
      100% { width: 90px; height: 90px; opacity: 0; }
    }
    /* spinner arc when transcribing */
    #mic-btn.transcribing::before {
      content: '';
      position: absolute;
      width: 62px; height: 62px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #4466cc;
      animation: micSpin 0.8s linear infinite;
    }
    @keyframes micSpin {
      to { transform: rotate(360deg); }
    }

    /* ── BUTTONS ── */
    .btn {
      background: #20203a;
      border: 1px solid #3a3a6a;
      color: #e0e0e0;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: #2a2a5a; border-color: #5555aa; }
    .btn.primary { background: #28286a; border-color: #6666cc; }
    .btn.primary:hover { background: #3a3a8a; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── NOTIFICATION ── */
    #notif {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e4a;
      border: 1px solid #5555bb;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      white-space: nowrap;
      z-index: 10;
    }
    #notif.visible { opacity: 1; }

    .thinking { opacity: 0.5; font-style: italic; }

    /* ── FITNESS TAB ── */
    .fitness-section { padding: 10px; border-bottom: 1px solid #1e1e3a; }
    .fitness-section-title { font-size: 10px; opacity: 0.4; letter-spacing: 1px; margin-bottom: 8px; }
    .fitness-today-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .fitness-square {
      width: 28px; height: 28px; border-radius: 5px;
      background: #1e1e3a; border: 1px solid #333;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: background 0.3s;
    }
    .fitness-square.weights { background: #6b1a1a; border-color: #cc3333; }
    .fitness-square.running { background: #1a2e6b; border-color: #3366cc; }
    .fitness-square.both    { background: #3a1a6b; border-color: #8844cc; }
    .fitness-square.ate-well-ring { box-shadow: 0 0 0 2px #ccaa00; }
    .macro-bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 11px; }
    .macro-label { width: 52px; opacity: 0.6; }
    .macro-track { flex: 1; height: 5px; background: #1e1e3a; border-radius: 3px; overflow: hidden; }
    .macro-fill  { height: 100%; border-radius: 3px; transition: width 0.4s; }
    .macro-val   { width: 38px; text-align: right; opacity: 0.8; font-size: 10px; }
    .week-grid { display: flex; gap: 4px; flex-wrap: wrap; }
    .week-cell {
      width: 30px; height: 30px; border-radius: 4px;
      background: #1e1e3a; border: 1px solid #2a2a4a;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-size: 8px; opacity: 0.7;
      cursor: default;
    }
    .week-cell.weights { background: #6b1a1a; border-color: #cc3333; opacity: 1; }
    .week-cell.running { background: #1a2e6b; border-color: #3366cc; opacity: 1; }
    .week-cell.both    { background: #3a1a6b; border-color: #8844cc; opacity: 1; }
    .week-cell .wc-dot { font-size: 10px; }
    .week-cell .wc-day { font-size: 8px; opacity: 0.6; margin-top: 1px; }
    .week-cell.ate-well { box-shadow: 0 0 0 2px #ccaa00; }
    .quick-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .fitness-btn { font-size: 11px; padding: 5px 8px; flex: 1; min-width: 70px; }
    .max-online  { width: 8px; height: 8px; border-radius: 50%; background: #00e888; display: inline-block; margin-right: 4px; }
    .max-offline { background: #ff4444; }
    #fitness-input-row { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #1e1e3a; flex-shrink: 0; }
    #fitness-input {
      flex: 1; background: #1a1a30; border: 1px solid #3a3a6a; border-radius: 6px;
      color: #e0e0e0; padding: 7px 9px; font-size: 12px; font-family: inherit; outline: none;
    }
    #fitness-input:focus { border-color: #FF6B35; }
    .notes-preview { font-size: 10px; opacity: 0.5; font-style: italic; padding: 0 10px 6px; line-height: 1.3; }

    /* ── CSS2D LABELS ── */
    .agent-label {
      background: rgba(10,10,30,0.82);
      border-radius: 6px;
      padding: 2px 8px 2px 6px;
      font-size: 10px;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.12);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .agent-label-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .speech-bubble {
      background: rgba(238,238,255,0.97);
      color: #111;
      border-radius: 9px;
      padding: 5px 9px;
      font-size: 10.5px;
      font-family: 'Courier New', monospace;
      max-width: 180px;
      line-height: 1.35;
      border: 1.5px solid #8888cc;
      pointer-events: none;
      user-select: none;
      display: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

<div id="header">
  <div id="title">AGENT HQ</div>
  <div id="agent-badges"></div>
  <div id="event-badge"></div>
</div>

<div id="main">
  <div id="canvas-wrap">
    <!-- Three.js renderer canvas goes here -->
    <div id="label-renderer"></div>
    <div id="notif"></div>
  </div>

  <div id="right-panel">
    <div id="controls">
      <button class="btn primary" id="btn-standup" onclick="doStandup()">📋 Standup</button>
      <button class="btn" id="btn-break" onclick="doBreak()">☕ Break</button>
      <button class="btn" id="btn-focus" onclick="doFocus()">🎯 Focus</button>
    </div>
    <div id="tabs">
      <button class="tab active" onclick="switchTab('chat')" id="tab-btn-chat">💬 Chat</button>
      <button class="tab" onclick="switchTab('tasks')" id="tab-btn-tasks">📋 Tasks <span id="task-count"></span></button>
      <button class="tab" onclick="switchTab('fitness')" id="tab-btn-fitness">💪 Fitness</button>
    </div>
    <div id="panel-chat" class="tab-panel">
      <div id="chat-log"></div>
    </div>
    <div id="panel-tasks" class="tab-panel" style="display:none">
      <div id="task-list"><div style="padding:16px;opacity:0.4;font-size:12px">No tasks yet. Type a task in the input below (e.g. "research Claude Code hooks") and it will be auto-assigned.</div></div>
    </div>
    <div id="panel-fitness" class="tab-panel" style="display:none;flex-direction:column">
      <!-- Today -->
      <div class="fitness-section">
        <div class="fitness-section-title">TODAY <span id="fitness-date"></span></div>
        <div class="fitness-today-row">
          <div class="fitness-square" id="fsq-main" title="Activity"></div>
          <div style="flex:1">
            <div style="font-size:11px;opacity:0.5" id="fitness-status-text">Loading...</div>
            <div style="font-size:10px;opacity:0.35" id="fitness-notes-preview"></div>
          </div>
          <button class="btn" style="font-size:10px;padding:3px 7px" onclick="refreshFitnessPanel()">↻</button>
        </div>
        <div id="macro-bars"></div>
      </div>
      <!-- Week -->
      <div class="fitness-section">
        <div class="fitness-section-title">THIS WEEK</div>
        <div class="week-grid" id="week-grid"></div>
      </div>
      <!-- Quick log -->
      <div class="fitness-section">
        <div class="fitness-section-title">QUICK LOG</div>
        <div class="quick-btns">
          <button class="btn fitness-btn" onclick="quickLog('weights')">🏋️ Weights</button>
          <button class="btn fitness-btn" onclick="quickLog('running')">🏃 Run</button>
          <button class="btn fitness-btn" onclick="quickLog('ateWell')">🥗 Ate Well</button>
          <button class="btn fitness-btn" onclick="quickLog('show')">📊 Grid</button>
        </div>
      </div>
      <!-- Max status -->
      <div class="fitness-section" style="display:flex;align-items:center;gap:6px;font-size:11px">
        <span class="max-online" id="max-status-dot"></span>
        <span id="max-status-text" style="opacity:0.6">Max checking in...</span>
      </div>
      <!-- Input -->
      <div id="fitness-input-row" style="margin-top:auto">
        <input type="text" id="fitness-input"
          placeholder='Tell Max: "ran 3 miles" or "had chicken and rice"...'
          onkeydown="if(event.key==='Enter')sendFitnessMsg()" />
        <button class="btn primary" onclick="sendFitnessMsg()">→</button>
      </div>
    </div>
    <div id="input-area">
      <input type="text" id="chat-input"
        placeholder="Message team, @Name task, or /standup..."
        onkeydown="if(event.key==='Enter')sendMsg()" />
      <button class="btn primary" onclick="sendMsg()">→</button>
    </div>

    <!-- Floating mic button -->
    <div id="mic-wrap">
      <span id="mic-label">HOLD TO SPEAK</span>
      <button id="mic-btn"
        onmousedown="startVoice(event)" onmouseup="stopVoice()" onmouseleave="stopVoice()"
        ontouchstart="startVoice(event)" ontouchend="stopVoice()">
        <!-- mic icon (idle / recording) -->
        <svg id="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8888cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="11" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
          <line x1="9" y1="21" x2="15" y2="21"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script type="importmap">

// ═══════════════════════════════════════════════════════════
//  TILE TO WORLD
// ═══════════════════════════════════════════════════════════

function tileToWorld(tx, ty) {
  return {
    x: (tx - GW / 2) * TS + TS / 2,
    y: 0,
    z: (ty - GH / 2) * TS + TS / 2,
  };
}

// ═══════════════════════════════════════════════════════════
//  THREE.JS SETUP
// ═══════════════════════════════════════════════════════════

function setupThree() {
  const wrap = document.getElementById('canvas-wrap');

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 2.2;
  wrap.insertBefore(renderer.domElement, wrap.firstChild);

  // CSS2D Renderer for labels/bubbles
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(wrap.clientWidth, wrap.clientHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.left = '0';
  labelRenderer.domElement.style.width = '100%';
  labelRenderer.domElement.style.height = '100%';
  labelRenderer.domElement.style.pointerEvents = 'none';
  labelRenderer.domElement.style.overflow = 'visible';
  wrap.appendChild(labelRenderer.domElement);

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  scene.fog = new THREE.FogExp2(0x1a1a2e, 0.012);

  // Camera
  const aspect = wrap.clientWidth / wrap.clientHeight;
  camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 200);
  camera.position.set(0, 32, 28);
  camera.lookAt(0, 0, 0);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.minDistance = 12;
  controls.maxDistance = 70;

  // Lighting — bright open-office feel
  const ambient = new THREE.AmbientLight(0xaabbff, 1.8);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
  dirLight.position.set(15, 30, 20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 100;
  dirLight.shadow.camera.left = -30;
  dirLight.shadow.camera.right = 30;
  dirLight.shadow.camera.top = 30;
  dirLight.shadow.camera.bottom = -30;
  scene.add(dirLight);

  // Fill light from opposite side
  const fillLight = new THREE.DirectionalLight(0x8899ff, 1.0);
  fillLight.position.set(-15, 20, -15);
  scene.add(fillLight);

  // 6 ceiling point lights — bright white office strips
  const ceilPositions = [[-8,8,-6],[0,8,-6],[8,8,-6],[-8,8,6],[0,8,6],[8,8,6]];
  ceilPositions.forEach(([cx, cy, cz]) => {
    const pl = new THREE.PointLight(0xddeeff, 1.2, 18);
    pl.position.set(cx, cy, cz);
    scene.add(pl);
  });

  // Gym accent light — orange/warm
  const gymLight = new THREE.PointLight(0xff8844, 1.0, 10);
  gymLight.position.set(10, 5, -8);
  scene.add(gymLight);
}

function buildOffice() {
  buildFloor();
  buildWalls();
  buildFurniture();
  buildRoomLabels();
}

function buildFloor() {
  for (let x = 0; x < GW; x++) {
    for (let y = 0; y < GH; y++) {
      const geo = new THREE.BoxGeometry(TS - 0.04, 0.1, TS - 0.04);
      let color = 0x2e2e4a;
      let roughness = 0.7;

      if (x >= 15 && y <= 6) {
        color = 0x1a1a22; roughness = 0.9; // gym — dark rubber
      } else if (x <= 5 && y <= 7) {
        color = 0x223355; roughness = 0.75; // meeting — blue carpet
      } else if (x <= 3) {
        color = 0x152215; roughness = 0.85; // server — green-tinted
      }

      const mat = new THREE.MeshStandardMaterial({ color, roughness, metalness: 0.15 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.receiveShadow = true;
      const pos = tileToWorld(x + 0.5, y + 0.5);
      mesh.position.set(pos.x, -0.05, pos.z);
      scene.add(mesh);
    }
  }
}

function buildWalls() {
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3a5a, roughness: 0.7, metalness: 0.2 });
  const wallH = 2.5;
  const wallT = 0.15;

  // North wall (y=0)
  const nw = new THREE.Mesh(new THREE.BoxGeometry(GW * TS, wallH, wallT), wallMat);
  const nPos = tileToWorld(GW / 2, 0);
  nw.position.set(nPos.x, wallH / 2, nPos.z);
  scene.add(nw);

  // South wall (y=GH)
  const sw = new THREE.Mesh(new THREE.BoxGeometry(GW * TS, wallH, wallT), wallMat);
  const sPos = tileToWorld(GW / 2, GH);
  sw.position.set(sPos.x, wallH / 2, sPos.z);
  scene.add(sw);

  // West wall (x=0)
  const ww = new THREE.Mesh(new THREE.BoxGeometry(wallT, wallH, GH * TS), wallMat);
  const wPos = tileToWorld(0, GH / 2);
  ww.position.set(wPos.x, wallH / 2, wPos.z);
  scene.add(ww);

  // East wall (x=GW)
  const ew = new THREE.Mesh(new THREE.BoxGeometry(wallT, wallH, GH * TS), wallMat);
  const ePos = tileToWorld(GW, GH / 2);
  ew.position.set(ePos.x, wallH / 2, ePos.z);
  scene.add(ew);
}

function buildFurniture() {
  for (const [type, tx, ty] of FURN) {
    const pos = tileToWorld(tx + 0.5, ty + 0.5);
    switch (type) {
      case 'desk':          makeDesk(pos.x, pos.z); break;
      case 'monitor':       /* included in makeDesk */ break;
      case 'chair':         makeChair(pos.x, pos.z); break;
      case 'round_table':   makeRoundTable(pos.x, pos.z); break;
      case 'couch':         makeCouch(pos.x, pos.z); break;
      case 'small_table':   makeSmallTable(pos.x, pos.z); break;
      case 'coffee_machine':makeCoffeeMachine(pos.x, pos.z); break;
      case 'counter':       makeCounter(pos.x, pos.z); break;
      case 'server':        makeServer(pos.x, pos.z); break;
      case 'whiteboard':    makeWhiteboard(pos.x, pos.z); break;
      case 'partition':     makePartition(pos.x, pos.z); break;
      case 'gym_mat':       makeGymMat(pos.x, pos.z); break;
      case 'treadmill':     makeTreadmill(pos.x, pos.z); break;
      case 'weight_rack':   makeWeightRack(pos.x, pos.z); break;
    }
  }
}

    new THREE.CylinderGeometry(0.06, 0.08, 0.12, 8),

class Agent {
  constructor(def) {
    Object.assign(this, def);
    this.x = LOCS[`desk_${def.id}`].x + (Math.random()-0.5)*0.4;
    this.y = LOCS[`desk_${def.id}`].y + (Math.random()-0.5)*0.4;
    this.tx = this.x; this.ty = this.y;
    this.targetLocKey = `desk_${def.id}`;
    this.status = 'working';
    this.task = 'Getting settled';
    this.memory = [];
    this.thinkTimer = Math.random() * 8000;
    this.taskWorkTimer = 0;
    this.nextTaskWorkIn = Infinity;
    this.activeTaskId = null;
    this.isBusy = false;
    this.walkFrame = 0;
    this.walkClock = 0;
    this.bob = 0;
    this.bobDir = 1;
    this.mesh = null;
    this._labelDiv = null;
    this._bubbleDiv = null;
    this._orbiters = [];
  }

  goTo(key) {
    const loc = LOCS[key];
    if (!loc) return;
    this.tx = loc.x + (Math.random()-0.5)*0.6;
    this.ty = loc.y + (Math.random()-0.5)*0.6;
    this.targetLocKey = key;
    this.status = 'moving';
    this.task = `Going to ${loc.label}`;
  }

  atTarget() {
    return Math.hypot(this.x - this.tx, this.y - this.ty) < 0.4;
  }

  update(dt) {
    const dx = this.tx - this.x, dy = this.ty - this.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > 0.05) {
      const move = AGENT_SPEED * (dt / 1000);
      this.x += (dx/d) * Math.min(move, d);
      this.y += (dy/d) * Math.min(move, d);
      this.walkClock += dt;
      if (this.walkClock > 130) { this.walkFrame = (this.walkFrame+1)%4; this.walkClock=0; }
    } else {
      if (this.status === 'moving') {
        this.status = this.activeTaskId ? 'working' : 'idle';
        this.task = LOCS[this.targetLocKey]?.label || this.task;
      }
      this.bob += 0.04 * this.bobDir;
      if (Math.abs(this.bob) > 1.0) this.bobDir *= -1;
    }
    if (!this.isBusy) {
      this.thinkTimer += dt;
      if (this.activeTaskId) this.taskWorkTimer += dt;
    }
  }

  remember(evt) {
    this.memory.push(`[${new Date().toLocaleTimeString()}] ${evt}`);
    if (this.memory.length > 12) this.memory.shift();
  }
}

// ═══════════════════════════════════════════════════════════
//  BUILD AGENT MESHES
// ═══════════════════════════════════════════════════════════

function buildAgentMesh(agent) {
  const group = new THREE.Group();
  const color = new THREE.Color(agent.hue);
  const darkColor = new THREE.Color(agent.dark);

  // Body (capsule)
  const bodyGeo = new THREE.CapsuleGeometry(0.28, 0.65, 4, 12);
  const bodyMat = new THREE.MeshStandardMaterial({ color: darkColor, roughness: 0.8 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.85;
  body.castShadow = true;
  group.add(body);

  // Head
  const headGeo = new THREE.SphereGeometry(0.22, 16, 12);
  const headMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 1.45;
  head.castShadow = true;
  group.add(head);

  // Eye highlights
  const eyeGeo = new THREE.SphereGeometry(0.04, 6, 6);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0xffffff), emissiveIntensity: 0.5 });
  [-0.09, 0.09].forEach(ex => {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(ex, 1.47, 0.18);
    group.add(eye);
  });

  // Ground ring
  const ringGeo = new THREE.RingGeometry(0.3, 0.42, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  group.add(ring);

  // Status ring (slightly larger, for pulsing)
  const statusRingGeo = new THREE.RingGeometry(0.44, 0.52, 32);
  const statusRingMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.0, side: THREE.DoubleSide });
  const statusRing = new THREE.Mesh(statusRingGeo, statusRingMat);
  statusRing.rotation.x = -Math.PI / 2;
  statusRing.position.y = 0.02;
  statusRing.userData.isStatusRing = true;
  group.add(statusRing);
  agent._statusRing = statusRing;
  agent._statusRingMat = statusRingMat;

  // Orbiting busy spheres
  const orbiterMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.8 });
  const orbiterGeo = new THREE.SphereGeometry(0.06, 6, 6);
  agent._orbiters = [];
  for (let i = 0; i < 3; i++) {
    const orb = new THREE.Mesh(orbiterGeo, orbiterMat.clone());
    orb.visible = false;
    group.add(orb);
    agent._orbiters.push(orb);
  }

  // CSS2D name label
  const labelDiv = document.createElement('div');
  labelDiv.className = 'agent-label';
  labelDiv.innerHTML = `<span class="agent-label-dot" style="background:${agent.hue}"></span>${agent.name}`;
  const labelObj = new CSS2DObject(labelDiv);
  labelObj.position.set(0, 1.9, 0);
  group.add(labelObj);
  agent._labelDiv = labelDiv;

  // CSS2D speech bubble
  const bubbleDiv = document.createElement('div');
  bubbleDiv.className = 'speech-bubble';
  bubbleDiv.style.borderColor = agent.hue;
  bubbleDiv.style.display = 'none';
  const bubbleObj = new CSS2DObject(bubbleDiv);
  bubbleObj.position.set(0, 2.3, 0);
  group.add(bubbleObj);
  agent._bubbleDiv = bubbleDiv;

  return group;
}

function buildAgents() {
  for (const def of AGENT_DEFS) {
    const agent = new Agent(def);
    agent.mesh = buildAgentMesh(agent);
    const pos = tileToWorld(agent.x, agent.y);
    agent.mesh.position.set(pos.x, 0, pos.z);
    scene.add(agent.mesh);
    agents.push(agent);
  }
}

function updateAgentMesh(agent, t) {
  if (!agent.mesh) return;

  const pos = tileToWorld(agent.x, agent.y);
  agent.mesh.position.x = pos.x;
  agent.mesh.position.z = pos.z;

  const dx = agent.tx - agent.x;
  const dy = agent.ty - agent.y;
  const moving = Math.hypot(dx, dy) > 0.08;

  if (moving) {
    agent.mesh.rotation.y = Math.atan2(dx, dy);
    // Walk bob
    const walkBob = Math.sin(t * 0.008) * 0.04;
    agent.mesh.position.y = walkBob;
  } else {
    agent.mesh.position.y = agent.bob * 0.04;
  }

  // Orbiting spheres when busy
  const radius = 0.5;
  agent._orbiters.forEach((orb, i) => {
    orb.visible = agent.isBusy;
    if (agent.isBusy) {
      const phase = (t * 0.003) + (i * Math.PI * 2 / 3);
      orb.position.set(
        Math.sin(phase) * radius,
        1.6 + Math.cos(phase * 2) * 0.1,
        Math.cos(phase) * radius
      );
    }
  });

  // Status ring pulse
  if (agent._statusRingMat) {
    const isActive = ['working', 'in_meeting', 'talking'].includes(agent.status);
    const pulse = isActive ? (Math.sin(t * 0.004) * 0.5 + 0.5) * 0.4 : 0;
    agent._statusRingMat.opacity = pulse;
  }
}

function buildBadges() {
  updateBadges();
}

// ═══════════════════════════════════════════════════════════
//  CLAUDE API (via backend)
// ═══════════════════════════════════════════════════════════

async function claude(system, user, maxTokens = 200) {
  const r = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system, user, maxTokens }),
  });
  const data = await r.json();
  if (!r.ok || data.error) throw new Error(data.error || `HTTP ${r.status}`);
  return data.text;
}

// ═══════════════════════════════════════════════════════════
//  TASK SYSTEM
// ═══════════════════════════════════════════════════════════

async function createTask(description, explicitAgentId = null) {
  const assignee = explicitAgentId
    ? agents.find(a => a.id === explicitAgentId)
    : agents.find(a => a.role === 'Script Writer');
  if (!assignee) return;

  let title = description.length > 45 ? description.slice(0, 42) + '...' : description;
  try {
    const raw = await claude(
      'Extract a short task title (max 40 chars). Return ONLY the title text, no quotes, no JSON.',
      description, 60
    );
    if (raw.trim().length < 50) title = raw.trim();
  } catch {}

  const task = {
    id: 'task_' + Date.now(),
    title,
    description,
    assigneeId: assignee.id,
    status: 'in_progress',
    updates: [],
    createdAt: Date.now(),
  };
  tasks.push(task);
  assignee.activeTaskId = task.id;
  assignee.taskWorkTimer = 0;
  assignee.nextTaskWorkIn = 8000 + Math.random() * 4000;

  const deskKey = `desk_${assignee.id}`;
  if (LOCS[deskKey]) {
    assignee.goTo(deskKey);
  }
  assignee.task = `Working: ${title.slice(0,30)}`;

  try {
    const sys = `You are ${assignee.name}, ${assignee.role} on a YouTube content production team. You just got assigned: "${title}". Acknowledge in 1 casual sentence, max 75 chars. Sound like yourself: ${assignee.personality}`;
    const ack = (await claude(sys, 'Acknowledge:', 90)).trim().replace(/^"|"$/g, '');
    addBubble(assignee.id, ack, 7000);
  } catch (e) {
    sysMsg(`⚠️ ${assignee.name} ack failed: ${e.message}`);
    addBubble(assignee.id, `On it — working on "${title.slice(0,25)}..."`, 5000);
  }
  assignee.remember(`Assigned task: ${title}`);

  updateTaskPanel();
  sysMsg(`📋 Task → ${assignee.name}: "${title}"`);
  return task;
}

async function doTaskWork(agent, task) {
  if (agent.isBusy || task.status !== 'in_progress') return;
  agent.isBusy = true;

  const updateNum = task.updates.length + 1;
  const isLast = updateNum >= 4;

  const sys = `You are ${agent.name}, ${agent.role} on a YouTube content production team. Personality: ${agent.personality}
You are autonomously working on: "${task.description}"
Generate update #${updateNum} of ~4. Be specific and realistic for your YouTube role.
Previous updates: ${task.updates.length ? task.updates.join(' | ') : 'none yet'}
${isLast ? 'This is your FINAL update — wrap up and announce completion!' : 'Show meaningful progress.'}
Max 100 chars. Plain text only.`;

  try {
    const update = (await claude(sys, 'Your work update:', 120)).trim().replace(/^"|"$/g,'');
    task.updates.push(update);
    if (isLast || /done|complet|finish|wrap|ship/i.test(update)) {
      task.status = 'done';
      agent.activeTaskId = null;
      agent.status = 'idle';
      agent.task = 'Task complete';
      addBubble(agent.id, update, 8000);
      sysMsg(`✅ ${agent.name} completed: "${task.title}"`);
    } else {
      addBubble(agent.id, update, 7000);
    }
    updateTaskPanel();
  } catch (e) {
    sysMsg(`⚠️ ${agent.name} task error: ${e.message}`);
  }

  agent.isBusy = false;
}

// ═══════════════════════════════════════════════════════════
//  AUTONOMOUS AGENT THINK
// ═══════════════════════════════════════════════════════════

async function agentThink(agent) {
  if (agent.isBusy) return;
  agent.isBusy = true;

  const nearby = agents
    .filter(a => a.id !== agent.id && Math.hypot(a.x-agent.x, a.y-agent.y) < 5)
    .map(a => a.name).join(', ') || 'nobody nearby';
  const locKeys = Object.keys(LOCS).join('|');

  const sys = `You are ${agent.name}, ${agent.role} on a YouTube content production team. Personality: ${agent.personality}
Respond ONLY with valid JSON (no other text):
{"action":"move"|"say"|"work","location":"${locKeys}","message":"max 70 chars","task":"what you are doing"}
- move: go somewhere (give location)
- say: say something to nearby colleagues (give message, keep it on-topic for your YouTube role)
- work: stay at desk and work (give task description relevant to your YouTube role)
Nearby: ${nearby}. Current location: ${LOCS[agent.targetLocKey]?.label}. Status: ${agent.status}.
Recent memory: ${agent.memory.slice(-3).join(' | ') || 'nothing'}.`;

  try {
    const raw = await claude(sys, 'Decide your next action. JSON only:', 120);
    const a = JSON.parse(raw.trim());
    if (a.action === 'move' && a.location && LOCS[a.location]) {
      agent.goTo(a.location);
      if (a.task) agent.task = a.task;
    } else if (a.action === 'say' && a.message) {
      agent.status = 'talking';
      if (a.task) agent.task = a.task;
      addBubble(agent.id, a.message, 7000);
      agents
        .filter(o => o.id !== agent.id && Math.hypot(o.x-agent.x, o.y-agent.y) < 5)
        .forEach(o => o.remember(`${agent.name} said: "${a.message}"`));
      setTimeout(() => { if (agent.status === 'talking') agent.status = 'idle'; }, 7000);
    } else {
      agent.status = 'working';
      if (a.task) agent.task = a.task;
    }
  } catch {
    agent.status = 'working';
  }

  agent.isBusy = false;
}

// ═══════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════

function simLoop(t) {
  requestAnimationFrame(simLoop);
  const dt = Math.min(t - lastT, 100);
  lastT = t;

  if (simRunning) {
    for (const ag of agents) {
      ag.update(dt);
      updateAgentMesh(ag, t);

      // Autonomous think
      if (!ag.isBusy && !ag.activeTaskId && !eventBusy && ag.thinkTimer > 15000 + Math.random()*5000) {
        ag.thinkTimer = 0;
        agentThink(ag);
      }

      // Task work
      const task = ag.activeTaskId ? tasks.find(tk => tk.id === ag.activeTaskId) : null;
      if (task && task.status === 'in_progress' && !ag.isBusy && ag.taskWorkTimer > ag.nextTaskWorkIn) {
        ag.taskWorkTimer = 0;
        ag.nextTaskWorkIn = 25000 + Math.random() * 10000;
        doTaskWork(ag, task);
      }
    }

    // Filter expired bubbles
    const now = Date.now();
    bubbles = bubbles.filter(b => {
      if (b.expiry <= now) {
        const ag = agents.find(a => a.id === b.agentId);
        if (ag?._bubbleDiv) ag._bubbleDiv.style.display = 'none';
        return false;
      }
      return true;
    });

    updateBadges();
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

async function doStandup() {
  if (eventBusy || standupBusy) return;
  standupBusy = eventBusy = true;
  setButtons(true);
  setEvent('STANDUP');
  notify('📋 Standup! Agents heading to meeting room...');

  const spots = [
    { x:2.2, y:2.2 },
    { x:4.5, y:2.2 },
    { x:2.2, y:4.5 },
    { x:4.5, y:4.5 },
    { x:3.5, y:2.0 },
  ];
  agents.forEach((ag, i) => {
    ag.status = 'in_meeting';
    const s = spots[i % spots.length];
    ag.tx = s.x + (Math.random()-0.5)*0.2;
    ag.ty = s.y + (Math.random()-0.5)*0.2;
    ag.targetLocKey = 'meeting';
    ag.task = 'Walking to standup';
    ag.remember('Standup meeting starting');
  });

  sysMsg('📋 All agents heading to the meeting room...');

  const startWait = Date.now();
  while (!agents.every(ag => ag.atTarget())) {
    if (Date.now() - startWait > 12000) break;
    await wait(150);
  }
  await wait(600);

  sysMsg('🎙️ Standup in session. Each agent will share their update.');

  const prev = [];
  for (const ag of agents) {
    await wait(800);
    sysMsg(`💬 ${ag.name} (${ag.role})...`);
    ag.isBusy = true;

    try {
      const taskCtx = ag.activeTaskId
        ? `Currently assigned task: ${tasks.find(t => t.id === ag.activeTaskId)?.title}`
        : 'No specific task assigned';
      const prevStr = prev.length
        ? `Others said: ${prev.map(p => `${p.n}: ${p.u}`).join(' | ')}`
        : 'You are first to speak.';

      const sys = `You are ${ag.name}, ${ag.role} at AgentCo. Personality: ${ag.personality}
AgentCo builds an AI-powered dev toolchain. You're in a standup. Be specific to your role.
${taskCtx}
${prevStr}
Give: what you did yesterday, what you're doing today, any blockers. 2-3 sentences max, 120 chars total. Conversational.`;

      const update = (await claude(sys, 'Your standup update:', 160)).trim().replace(/^"|"$/g,'');
      prev.push({ n: ag.name, u: update });
      ag.status = 'talking';
      addBubble(ag.id, update, 9000);
      chatMsg(ag.name, update, ag.hue, 'agent');
      agents.filter(o => o.id !== ag.id).forEach(o => o.remember(`${ag.name} standup: ${update}`));
    } catch(e) {
      console.error('Standup error for', ag.name, e);
      chatMsg(ag.name, `[error: ${e.message}]`, '#ff4444', 'system');
    }

    ag.isBusy = false;
    await wait(8000);
    ag.status = 'in_meeting';
  }

  await wait(1000);
  sysMsg('✅ Standup done! Great sync everyone.');
  notify('✅ Standup complete!');
  setEvent('');

  agents.forEach(ag => {
    ag.status = 'idle';
    const key = LOCS[`desk_${ag.id}`] ? `desk_${ag.id}` : 'desk_alex';
    ag.goTo(key);
  });

  standupBusy = eventBusy = false;
  setButtons(false);
}

async function doBreak() {
  if (eventBusy) return;
  eventBusy = true;
  setButtons(true);
  notify('☕ Break time! Agents heading out...');
  setEvent('BREAK TIME');

  const spots = ['coffee', 'coffee', 'lounge', 'lounge', 'lounge'];
  agents.forEach((ag, i) => {
    ag.goTo(spots[i % spots.length]);
    ag.remember('Team taking a break');
  });

  sysMsg('☕ Break time! Agents heading to the break room and lounge...');

  const t0 = Date.now();
  while (!agents.every(ag => ag.atTarget())) {
    if (Date.now() - t0 > 10000) break;
    await wait(150);
  }
  await wait(400);

  for (const ag of agents.slice(0, 3)) {
    try {
      const sys = `You are ${ag.name}, ${ag.role}. You're on a coffee break with coworkers. Say something casual, funny, or relatable. Max 60 chars. Personality: ${ag.personality}`;
      const txt = (await claude(sys, 'What do you say?', 80)).trim().replace(/^"|"$/g,'');
      addBubble(ag.id, txt, 7000);
      chatMsg(ag.name, txt, ag.hue, 'agent');
    } catch {}
    await wait(2500);
  }

  await wait(8000);
  sysMsg('🔔 Break over! Agents heading back to work.');
  setEvent('');
  eventBusy = false;
  setButtons(false);

  agents.forEach(ag => {
    const key = LOCS[`desk_${ag.id}`] ? `desk_${ag.id}` : 'desk_alex';
    ag.goTo(key);
    ag.status = 'working';
  });
}

async function doFocus() {
  if (eventBusy) return;
  notify('🎯 Focus mode! Back to desks.');
  setEvent('FOCUS TIME');
  agents.forEach(ag => {
    const key = LOCS[`desk_${ag.id}`] ? `desk_${ag.id}` : 'desk_alex';
    ag.goTo(key);
    ag.status = 'working';
    ag.task = 'Deep focus';
    ag.remember('Focus session started');
  });
  await wait(3000);
  setEvent('');
}

// ═══════════════════════════════════════════════════════════
//  VOICE INPUT (ElevenLabs STT)
// ═══════════════════════════════════════════════════════════

let _mediaRecorder = null;
let _audioChunks = [];
let _voiceActive = false;

async function startVoice(e) {
  e.preventDefault();
  if (_voiceActive) return;

  const btn = document.getElementById('mic-btn');

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    sysMsg('⚠️ Mic permission denied');
    return;
  }

  _voiceActive = true;
  _audioChunks = [];
  btn.classList.add('recording');
  document.getElementById('mic-wrap').classList.add('active');
  document.getElementById('mic-label').textContent = 'RELEASE TO SEND';
  const icon = document.getElementById('mic-icon');
  if (icon) icon.setAttribute('stroke', '#ff6666');

  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';

  _mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
  _mediaRecorder.ondataavailable = e => { if (e.data.size > 0) _audioChunks.push(e.data); };
  _mediaRecorder.onstop = () => stream.getTracks().forEach(t => t.stop());
  _mediaRecorder.start();
}

async function stopVoice() {
  if (!_voiceActive || !_mediaRecorder) return;
  _voiceActive = false;

  const btn = document.getElementById('mic-btn');
  btn.classList.remove('recording');
  btn.classList.add('transcribing');
  document.getElementById('mic-label').textContent = 'TRANSCRIBING…';
  const icon2 = document.getElementById('mic-icon');
  if (icon2) icon2.setAttribute('stroke', '#4466cc');

  _mediaRecorder.stop();

  await new Promise(r => setTimeout(r, 150));

  if (_audioChunks.length === 0) {
    btn.classList.remove('transcribing');
    document.getElementById('mic-wrap').classList.remove('active');
    document.getElementById('mic-label').textContent = 'HOLD TO SPEAK';
    const iconX = document.getElementById('mic-icon');
    if (iconX) iconX.setAttribute('stroke', '#8888cc');
    return;
  }

  try {
    const blob = new Blob(_audioChunks, { type: _mediaRecorder.mimeType || 'audio/webm' });
    const formData = new FormData();
    formData.append('audio', blob, 'voice.webm');

    const res = await fetch('/api/transcribe', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    const text = (data.text || '').trim();
    if (text) {
      const input = document.getElementById('chat-input');
      input.value = text;
      sysMsg(`🎤 "${text}"`);
      sendMsg();
    }
  } catch (e) {
    sysMsg(`⚠️ Voice error: ${e.message}`);
  } finally {
    btn.classList.remove('transcribing');
    document.getElementById('mic-wrap').classList.remove('active');
    document.getElementById('mic-label').textContent = 'HOLD TO SPEAK';
    const icon3 = document.getElementById('mic-icon');
    if (icon3) icon3.setAttribute('stroke', '#8888cc');
    _audioChunks = [];
    _mediaRecorder = null;
  }
}

//  CHAT & TASK ROUTING
// ═══════════════════════════════════════════════════════════

async function sendMsg() {
  const el  = document.getElementById('chat-input');
  const msg = el.value.trim();
  if (!msg || !simRunning) return;
  el.value = '';

  // Slash commands: fast-path, no LLM
  if (msg === '/standup') { chatMsg('You', msg, '#cccfff', 'user'); doStandup(); return; }
  if (msg === '/break')   { chatMsg('You', msg, '#cccfff', 'user'); doBreak();   return; }
  if (msg === '/focus')   { chatMsg('You', msg, '#cccfff', 'user'); doFocus();   return; }

  chatMsg('You', msg, '#cccfff', 'user');
  const thinkId = showThinking();

  try {
    const r = await fetch('/api/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    const plan = await r.json();
    if (plan.error) throw new Error(plan.error);
    hideThinking(thinkId);
    await executePlan(plan, msg);
  } catch (e) {
    hideThinking(thinkId);
    sysMsg(`⚠️ Planner error: ${e.message}`);
  }
}

async function executePlan(plan, msg) {
  if (plan.directorMessage) sysMsg(`🎬 ${plan.directorMessage}`);

  for (const step of plan.steps) {
    const agent = agents.find(a => a.id === step.agent);
    if (!agent) { sysMsg(`⚠️ Unknown agent: ${step.agent}`); continue; }

    const input = step.input || msg;

    switch (step.skill) {
      case 'fitness':
        await handleFitnessMessage(input, agent);
        break;

      case 'task':
        await createTask(input, agent.id);
        break;

      case 'chat': {
        agent.remember(`Manager said to you: "${input}"`);
        try {
          const sys = `You are ${agent.name}, ${agent.role} on a YouTube content production team. `
            + `Reply to your manager: 1-2 sentences, max 90 chars. `
            + `Personality: ${agent.personality}. Currently: ${agent.task}.`;
          const reply = (await claude(sys, input, 110)).trim().replace(/^"|"$/g, '');
          addBubble(agent.id, reply, 7000);
          chatMsg(agent.name, reply, agent.hue, 'agent');
        } catch (e) {
          sysMsg(`⚠️ ${agent.name}: ${e.message}`);
          addBubble(agent.id, 'On it!', 3000);
        }
        break;
      }

      default:
        // script, thumbnail, research, seo, repurpose, post
        await handleSkillMessage(input, agent, step.skill);
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════════

function addBubble(id, text, dur = 6000) {
  bubbles = bubbles.filter(b => b.agentId !== id);
  bubbles.push({ agentId: id, text, expiry: Date.now() + dur });
  // Update the CSS2D bubble div
  const ag = agents.find(a => a.id === id);
  if (ag?._bubbleDiv) {
    ag._bubbleDiv.textContent = text;
    ag._bubbleDiv.style.display = 'block';
  }
}

function chatMsg(sender, text, color, type) {
  const log = document.getElementById('chat-log');
  const d = document.createElement('div');
  d.className = `chat-msg ${type}`;
  d.innerHTML = `<div class="msg-sender" style="color:${color}">${sender}</div><div class="msg-text">${text}</div>`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function sysMsg(t) { chatMsg('System', t, '#6666bb', 'system'); }

function showThinking() {
  const log = document.getElementById('chat-log');
  const d = document.createElement('div');
  d.className = 'chat-msg system';
  const id = 'think_' + Date.now();
  d.dataset.thinkId = id;
  d.innerHTML = `<div class="msg-sender" style="color:#6666bb">Director</div>`
    + `<div class="msg-text" style="display:flex;align-items:center;gap:8px;">Routing `
    + `<span class="thinking-dots"><span></span><span></span><span></span></span></div>`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return id;
}
function hideThinking(id) {
  document.querySelector(`[data-think-id="${id}"]`)?.remove();
}

function switchTab(tab) {
  ['chat','tasks','fitness'].forEach(t => {
    const panel = document.getElementById(`panel-${t}`);
    const btn   = document.getElementById(`tab-btn-${t}`);
    if (panel) panel.style.display = t === tab ? 'flex' : 'none';
    if (btn)   btn.classList.toggle('active', t === tab);
  });
  if (tab === 'fitness') refreshFitnessPanel();
}

function updateTaskPanel() {
  const el  = document.getElementById('task-list');
  const cnt = document.getElementById('task-count');
  const active = tasks.filter(t => t.status === 'in_progress').length;
  cnt.textContent = active ? `(${active})` : '';

  if (!tasks.length) {
    el.innerHTML = '<div style="padding:16px;opacity:0.4;font-size:12px">No tasks yet.</div>';
    return;
  }

  el.innerHTML = [...tasks].reverse().map(t => {
    const ag = agents.find(a => a.id === t.assigneeId);
    const latestUpdate = t.updates[t.updates.length - 1] || 'Starting...';
    const icon = t.status === 'done' ? '✅' : '⟳';
    const age  = Math.floor((Date.now() - t.createdAt) / 60000);
    return `<div class="task-item ${t.status}">
      <div class="task-header">
        <span class="task-icon">${icon}</span>
        <span class="task-title">${t.title}</span>
      </div>
      <div class="task-meta">
        <span style="color:${ag?.hue||'#888'}">${ag?.name||'?'}</span>
        <span class="task-age">${age}m ago</span>
      </div>
      <div class="task-update">${latestUpdate}</div>
      ${t.updates.length > 1
        ? `<details><summary style="font-size:10px;opacity:0.5;cursor:pointer">${t.updates.length} updates</summary><div class="task-history">${t.updates.map((u,i) => `<div class="update-item">#${i+1}: ${u}</div>`).join('')}</div></details>`
        : ''}
    </div>`;
  }).join('');
}

function updateBadges() {
  document.getElementById('agent-badges').innerHTML = agents.map(ag => `
    <div class="agent-badge">
      <div class="agent-dot" style="background:${['working','in_meeting','talking'].includes(ag.status) ? ag.hue : '#444'}"></div>
      <span style="color:${ag.hue}">${ag.name}</span>
      <span style="opacity:0.45;font-size:10px">${ag.status}</span>
    </div>`).join('');
}

function notify(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 3000);
}

function setEvent(txt) {
  const el = document.getElementById('event-badge');
  if (txt) { el.textContent = txt; el.classList.add('show'); }
  else { el.classList.remove('show'); }
}

function setButtons(disabled) {
  ['btn-standup','btn-break','btn-focus'].forEach(id => {
    document.getElementById(id).disabled = disabled;
  });
}

//  FITNESS AGENT

async function sendFitnessMsg() {
  const el = document.getElementById('fitness-input');
  const msg = el.value.trim();
  if (!msg || !simRunning) return;
  el.value = '';
  const max = agents.find(a => a.id === 'max');
  if (max) handleFitnessMessage(msg, max);
}

async function quickLog(type) {
  const max = agents.find(a => a.id === 'max');
  if (!max || !simRunning) return;
  const msgs = {
    weights: 'I did a weights session today',
    running: 'I went for a run today',
    ateWell: 'I ate well today',
    show:    'show my fitness grid',
  };
  if (msgs[type]) handleFitnessMessage(msgs[type], max);
}

async function handleFitnessMessage(msg, maxAgent) {
  maxAgent.goTo('gym');
  maxAgent.isBusy = true;
  maxAgent.status = 'working';
  maxAgent.task = 'Processing fitness log...';

  switchTab('fitness');

  try {
    const r = await fetch('/api/fitness/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);

    if (data.response) {
      addBubble(maxAgent.id, data.response, 9000);
      chatMsg(maxAgent.name, data.response, maxAgent.hue, 'agent');
    }

    if (data.logged) {
      const dateLabel = data.targetDate && data.targetDate !== new Date().toISOString().slice(0,10)
        ? ` for ${data.targetDate}` : '';
      sysMsg(`✅ Logged by Max${dateLabel}`);
      await refreshFitnessPanel();
    } else if (data.intent === 'check_progress') {
      await refreshFitnessPanel();
    }

    if (data.addNutrition) {
      sysMsg(`🥗 Saved "${data.addNutrition.name}" to nutrition DB`);
    }

    if (data.openGrid) {
      window.open('http://localhost:5173', '_blank');
      sysMsg('📊 Opened fitness grid');
    }

    maxAgent.status = 'idle';
    maxAgent.task = 'At the gym';
  } catch (e) {
    sysMsg(`⚠️ Max error: ${e.message}`);
    addBubble(maxAgent.id, "Sorry, couldn't log that right now!", 5000);
    maxAgent.status = 'idle';
  }

  maxAgent.isBusy = false;
}

async function handleSkillMessage(msg, agent, skillType) {
  const deskKey = `desk_${agent.id}`;
  if (LOCS[deskKey]) agent.goTo(deskKey);
  agent.isBusy = true;
  agent.status = 'working';
  agent.task = `Running ${skillType}...`;
  addBubble(agent.id, `Working on ${skillType}...`, 30000);
  sysMsg(`⚙️ ${agent.name} started ${skillType}`);
  switchTab('chat');

  try {
    const r = await fetch(`/api/skill/${skillType}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, agent: agent.id }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    addBubble(agent.id, data.summary || '✅ Done!', 9000);
    chatMsg(agent.name, data.summary || data.response, agent.hue, 'agent');
    if (data.files && data.files.length) sysMsg(`📁 Saved: ${data.files.join(', ')}`);
    sysMsg(`✅ ${agent.name} finished ${skillType}`);
  } catch (e) {
    sysMsg(`⚠️ ${agent.name} skill error: ${e.message}`);
    addBubble(agent.id, "Hit a snag!", 4000);
  }

  agent.isBusy = false;
  agent.status = 'idle';
  agent.task = 'Idle';
}

async function refreshFitnessPanel() {
  let online = false;
  try {
    const s = await fetch('/api/fitness/status');
    const sd = await s.json();
    online = sd.online;
  } catch {}

  const dot  = document.getElementById('max-status-dot');
  const stxt = document.getElementById('max-status-text');
  if (dot) dot.className = online ? 'max-online' : 'max-online max-offline';
  if (stxt) stxt.textContent = online ? 'Fitness API connected' : 'Fitness API offline — start with: cd ~/fitness-app && bun run dev';

  if (!online) return;

  try {
    const r  = await fetch('/api/fitness/today');
    const td = await r.json();
    renderTodayCard(td);
  } catch {}

  try {
    const r   = await fetch('/api/fitness/week');
    const wk  = await r.json();
    renderWeekGrid(wk);
  } catch {}
}

function renderTodayCard(td) {
  const sq   = document.getElementById('fsq-main');
  const stxt = document.getElementById('fitness-status-text');
  const notesEl = document.getElementById('fitness-notes-preview');
  const dateEl  = document.getElementById('fitness-date');
  if (!sq) return;

  const today = new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  if (dateEl) dateEl.textContent = `— ${today}`;

  if (!td) {
    sq.className = 'fitness-square';
    sq.textContent = '—';
    if (stxt) stxt.textContent = 'No activity yet today';
    if (notesEl) notesEl.textContent = '';
    document.getElementById('macro-bars').innerHTML = '';
    return;
  }

  const w = td.weights, run = td.running, ate = td.ateWell;
  sq.className = 'fitness-square' + (w && run ? ' both' : w ? ' weights' : run ? ' running' : '') + (ate ? ' ate-well-ring' : '');
  sq.textContent = w && run ? '💜' : w ? '🏋️' : run ? '🏃' : ate ? '🥗' : '—';
  if (stxt) stxt.textContent = [w && 'Weights', run && 'Running', ate && 'Ate well'].filter(Boolean).join(' · ') || 'Rest day';
  if (notesEl) notesEl.textContent = td.notes ? td.notes.slice(0, 80) + (td.notes.length > 80 ? '…' : '') : '';

  const goals = { calories: 2200, protein: 150, carbs: 250, fat: 70 };
  const macros = [
    { label: 'Calories', val: td.calories || 0, goal: goals.calories, unit: 'kcal', color: '#ff8c42' },
    { label: 'Protein',  val: td.protein  || 0, goal: goals.protein,  unit: 'g',    color: '#4A90E2' },
    { label: 'Carbs',    val: td.carbs    || 0, goal: goals.carbs,    unit: 'g',    color: '#4AE280' },
    { label: 'Fat',      val: td.fat      || 0, goal: goals.fat,      unit: 'g',    color: '#E2784A' },
  ];
  const barsEl = document.getElementById('macro-bars');
  if (barsEl) barsEl.innerHTML = macros.map(m => {
    const pct = Math.min(100, Math.round((m.val / m.goal) * 100));
    return `<div class="macro-bar-row">
      <span class="macro-label">${m.label}</span>
      <div class="macro-track"><div class="macro-fill" style="width:${pct}%;background:${m.color}"></div></div>
      <span class="macro-val">${m.val}${m.unit}</span>
    </div>`;
  }).join('');
}

function renderWeekGrid(week) {
  const el = document.getElementById('week-grid');
  if (!el || !week) return;
  const days = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  el.innerHTML = [...week].reverse().map(d => {
    const date = new Date(d.date + 'T12:00:00');
    const day  = days[date.getDay()];
    const cls  = d.weights && d.running ? 'both' : d.weights ? 'weights' : d.running ? 'running' : '';
    const ate  = d.ateWell ? ' ate-well' : '';
    const icon = d.weights && d.running ? '💜' : d.weights ? '🏋️' : d.running ? '🏃' : '';
    return `<div class="week-cell ${cls}${ate}" title="${d.date}">
      <div class="wc-dot">${icon}</div>
      <div class="wc-day">${day}</div>
    </div>`;
  }).join('');
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function init() {
  setupThree();
  buildOffice();
  buildAgents();
  buildBadges();
  setupResize();
  refreshFitnessPanel();

  // Start loop (even before sim running for idle scene)
  requestAnimationFrame(simLoop);

  // Check server
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    if (!s.keyLoaded) {
      showKeyOverlay();
      return;
    }
  } catch {
    document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#ff6666;font-family:monospace;text-align:center;background:#0a0a18">
      <div><h2>⚠️ Server Not Running</h2>
      <p style="margin-top:12px;opacity:0.7">cd ai-office && npm start</p></div></div>`;
    return;
  }
  startAgents();
}

function showKeyOverlay() {
  const overlay = document.createElement('div');
  overlay.id = 'key-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(5,5,20,0.95);display:flex;align-items:center;justify-content:center;z-index:100;font-family:Courier New,monospace';
  overlay.innerHTML = `
    <div style="background:#12122a;border:1px solid #3a3a7a;border-radius:14px;padding:36px 40px;text-align:center;max-width:440px;width:90%">
      <div style="color:#8888ff;font-size:18px;font-weight:bold;letter-spacing:2px;margin-bottom:10px">AGENT HQ</div>
      <p style="font-size:13px;opacity:0.6;margin-bottom:20px;line-height:1.5">
        Enter your Anthropic API key to start.<br>
        <span style="opacity:0.5;font-size:11px">Key is stored server-side only — never persisted to disk.</span>
      </p>
      <input id="key-input" type="password" placeholder="sk-ant-..."
        style="width:100%;background:#1a1a35;border:1px solid #3a3a7a;border-radius:7px;color:#e0e0e0;padding:11px 13px;font-size:13px;font-family:inherit;outline:none;margin-bottom:12px"
        onkeydown="if(event.key==='Enter')submitKey()" />
      <button onclick="submitKey()"
        style="width:100%;background:#28286a;border:1px solid #6666cc;color:#e0e0e0;padding:10px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px">
        Launch Simulation →
      </button>
      <div id="key-error" style="color:#ff6666;font-size:11px;margin-top:8px;display:none"></div>
      <p style="font-size:10px;opacity:0.3;margin-top:12px">Or restart server after adding key to .env file</p>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('key-input')?.focus(), 100);
}

async function submitKey() {
  const input = document.getElementById('key-input');
  const errEl = document.getElementById('key-error');
  const key = input?.value.trim();
  if (!key || !key.startsWith('sk-')) {
    if (errEl) { errEl.textContent = 'Key must start with sk-'; errEl.style.display = 'block'; }
    return;
  }
  try {
    const r = await fetch('/api/setkey', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    document.getElementById('key-overlay')?.remove();
    startAgents();
  } catch(e) {
    if (errEl) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  }
}

function startAgents() {
  simRunning = true;
  sysMsg('🚀 Agents are live! Type a message, assign tasks, or click Standup.');
  sysMsg('💡 Try: "research Claude Code hooks" or "@Alex build the login UI"');
  sysMsg('Tip: @Name to address someone directly · /standup · /break · /focus');
}
